name: hq-paperclip
services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperclip
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U paperclip -d paperclip"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    cpus: 1.0
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  server:
    image: ghcr.io/paperclipai/paperclip@sha256:a02ac35ac41df911af477422ea0e781cf41d2b2c600c66f0a5ac9d8c63f52c2c
    restart: unless-stopped
    user: "1000:1000"
    environment:
      DATABASE_URL: postgres://paperclip:${POSTGRES_PASSWORD}@db:5432/paperclip
      HOST: 0.0.0.0
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: https://paperclip.example.invalid
      PAPERCLIP_ALLOWED_HOSTNAMES: paperclip.example.invalid,192.0.2.180,192.0.2.180:8443,localhost,server
      PAPERCLIP_API_URL: http://localhost:3100
      PAPERCLIP_AUTH_DISABLE_SIGN_UP: ${DISABLE_SIGN_UP:-false}
      PAPERCLIP_TELEMETRY_DISABLED: "1"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?required}
      PAPERCLIP_AGENT_JWT_SECRET: ${PAPERCLIP_AGENT_JWT_SECRET:?required}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?required}
    volumes:
      - ./data:/paperclip
      - ./agents:/opt/hq-agents:ro
      - ./control-center:/opt/hq-control-plugin:ro
      - ./worker-secrets/codex-bridge-token:/run/secrets/codex-bridge-token:ro
      - ./pi-worker/cluster_health.py:/opt/collectors/cluster_health.py:ro
      - ./operations/snapshots:/opt/hq-observations:ro
      - /run/hq-vault-runtime/amd-gpu-api:/run/secrets/amd-gpu-token:ro
      - /run/hq-vault-runtime/nvidia-gpu-api:/run/secrets/nvidia-gpu-token:ro
      - ../../secrets/nvidia-gpu-server.crt:/run/secrets/nvidia-gpu-ca.crt:ro
      - ./worker-secrets/pi-bridge-token:/run/secrets/pi-bridge-token:ro
    networks: [default, codex_private]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3100/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    pids_limit: 512
    mem_limit: 4g
    cpus: 2.0
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
  pi-worker:
    build: ./pi-worker
    image: hq-paperclip-pi:0.74.0
    restart: unless-stopped
    init: true
    user: "1000:1000"
    volumes:
      - ./agents:/opt/hq-agents:ro
      - ./pi-worker/pi_runtime.py:/opt/worker/pi_runtime.py:ro
      - ./pi-worker/server_ops.py:/opt/worker/server_ops.py:ro
      - ../hermes/access/benjamin-ops:/run/secrets/benjamin-ops:ro
      - ./pi-worker/worker.py:/opt/worker/worker.py:ro
      - ./pi-worker/models.json:/home/node/.pi/agent/models.json:ro
      - ./pi-worker/inference-settings.ts:/opt/worker/inference-settings.ts:ro
      - ./worker-workspaces:/workspace
      - ./data/hq-locks:/paperclip/hq-locks
      - ./data/hq-control:/paperclip/hq-control:ro
      - ./worker-secrets/pi-bridge-token:/run/secrets/pi-bridge-token:ro
      - /run/hq-vault-runtime/amd-gpu-api:/run/secrets/amd-gpu-token:ro
      - /run/hq-vault-runtime/nvidia-gpu-api:/run/secrets/nvidia-gpu-token:ro
      - ../../secrets/nvidia-gpu-server.crt:/run/secrets/nvidia-gpu-ca.crt:ro
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
  codex-worker:
    image: ghcr.io/paperclipai/paperclip@sha256:a02ac35ac41df911af477422ea0e781cf41d2b2c600c66f0a5ac9d8c63f52c2c
    restart: unless-stopped
    user: "0:0"
    entrypoint: [python3, /opt/isolated/worker.py]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./codex-isolated:/opt/isolated:ro
      - ./codex-worker-auth:/auth
      - ./codex-worker-data:/jobs
      - ./worker-secrets/codex-worker-bridge-token:/run/secrets/worker-bridge-token:ro
    networks: [codex_private]
    dns: [127.0.0.1]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, KILL, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    logging: *logging
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  codex-egress:
    image: ghcr.io/paperclipai/paperclip@sha256:a02ac35ac41df911af477422ea0e781cf41d2b2c600c66f0a5ac9d8c63f52c2c
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: [python3, /opt/isolated/egress.py]
    read_only: true
    volumes: [./codex-isolated:/opt/isolated:ro]
    networks: [default, codex_private]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    logging: *logging
  proxy:
    image: nginx:stable-alpine@sha256:985220252f3863977e468f611ef118ebd01421289dd86ee1ae99cb068c3bce2b
    restart: unless-stopped
    ports: ["192.0.2.180:8443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../n8n/tls:/etc/nginx/tls:ro
    depends_on:
      server: {condition: service_healthy}
    mem_limit: 128m
    logging: *logging
volumes:
  pgdata:

networks:
  codex_private:
    internal: true
