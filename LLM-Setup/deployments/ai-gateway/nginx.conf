map $http_upgrade $ai_connection_upgrade {
    default upgrade;
    '' close;
}
log_format ai_gateway '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent upstream=$upstream_status duration=$request_time';
server {
    listen 192.0.2.21:3000;
    server_name _;
    allow 192.0.2.0/24;
    deny all;
    access_log /var/log/nginx/ai-webui.access.log ai_gateway;
    client_max_body_size 100m;
    location / {
        proxy_pass http://198.51.100.202:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ai_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }
}
server {
    listen 192.0.2.21:11434;
    server_name _;
    allow 192.0.2.0/24;
    deny all;
    access_log /var/log/nginx/ai-api.access.log ai_gateway;
    client_max_body_size 100m;
    location / {
        proxy_pass http://198.51.100.202:11434;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }
}
