        "/app/gateway_start.py"
      ],
      "profiles": [
        "discord"
      ],
      "environment": {
        "HERMES_HOME": "/profile",
        "XDG_STATE_HOME": "/profile/runtime-state",
        "XDG_CACHE_HOME": "/profile/cache",
        "PYTHONPATH": "/opt/hermes",
        "PYTHONDONTWRITEBYTECODE": "1",
        "DISCORD_PROXY": "http://discord-egress:8888"
      },
      "volumes": [
        "./gateway_start.py:/app/gateway_start.py:ro",
        "./mcp_server.py:/app/mcp_server.py:ro",
        "./profiles/concierge:/profile",
        "./plugin:/profile/plugins/hq-operations:ro",
        "./access/concierge:/run/access/identity:ro",
        "./access/discord-token:/run/access/discord-token:ro",
        "./run/github:/github-socket:ro",
        "./access/github-origin:/run/access/github-origin:ro"
      ]
    }
  },
  "networks": {
    "private": {
      "internal": true
    },
    "egress": {},
    "paperclip": {
      "external": true,
      "name": "hq-paperclip_default"
    }
  }
}
