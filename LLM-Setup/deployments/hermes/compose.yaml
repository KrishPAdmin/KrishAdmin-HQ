{
  "name": "hq-hermes",
  "services": {
    "health": {
      "image": "nousresearch/hermes-agent@sha256:d27689bc6e8581ec884a7227c9101fdaebf6c853cff8859020dac14f21452b4d",
      "restart": "unless-stopped",
      "init": true,
      "user": "1000:1000",
      "read_only": true,
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=256m"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "pids_limit": 128,
      "mem_limit": "1g",
      "cpus": 1.0,
      "networks": [
        "private"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health',timeout=3)"
        ],
        "interval": "20s",
        "timeout": "5s",
        "retries": 3,
        "start_period": "45s"
      },
      "entrypoint": [
        "python",
        "/app/worker.py"
      ],
      "environment": {
        "HERMES_HOME": "/profile",
        "HQ_PROFILE": "health",
        "PYTHONPATH": "/opt/hermes",
        "PYTHONDONTWRITEBYTECODE": "1",
        "HQ_CONTEXT_CONFIG": "/config/context-windows.json"
      },
      "volumes": [
        "./worker.py:/app/worker.py:ro",
        "./capabilities.py:/app/capabilities.py:ro",
        "./profiles/health:/profile",
        "./access/health:/run/access/identity:ro",
        "./access/worker:/run/access/worker:ro",
        "./context_settings.py:/app/context_settings.py:ro",
        "./config:/config:ro"
      ]
    },
