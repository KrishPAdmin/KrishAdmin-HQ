map $http_upgrade $connection_upgrade { default upgrade; '' close; }
log_format hq_ui '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 443 ssl;
    server_name 192.0.2.180;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/access.log hq_ui;
    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;
    location = /static/custom.css {
        alias /usr/share/nginx/hq-theme/custom.css;
        default_type text/css;
        add_header Cache-Control "no-store";
    }
    location /hq-theme/ {
        alias /usr/share/nginx/hq-theme/;
        add_header Cache-Control "no-cache";
    }
    location / {
        proxy_pass http://198.51.100.202:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        sub_filter '<head>' '<head><script src="/hq-theme/default-theme.js"></script>';
        sub_filter_once on;
    }
}
