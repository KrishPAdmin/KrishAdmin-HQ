name: krishadmin-openwebui
services:
  gateway:
    image: nginx@sha256:ef8676b33d681f272ba429b27658bdd7e640963279714c96bddf1dc76307f7b6
    restart: unless-stopped
    ports:
      - "192.0.2.180:3443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./theme:/usr/share/nginx/hq-theme:ro
      - /home/operator/krishadmin-hq/deployments/n8n/tls:/etc/nginx/tls:ro
    security_opt: [no-new-privileges:true]
