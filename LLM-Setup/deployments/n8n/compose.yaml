name: homelab-n8n
services:
  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["192.0.2.180:443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
      - ./portal:/usr/share/nginx/html/hq:ro
    networks: [services]
    depends_on:
      n8n:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    ports: ["127.0.0.1:5678:5678"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n_app
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_APP_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      NODE_EXTRA_CA_CERTS: /etc/krishadmin-hq/nvidia-gpu-server.crt
      N8N_HOST: 192.0.2.180
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      N8N_EDITOR_BASE_URL: https://192.0.2.180
      WEBHOOK_URL: https://192.0.2.180/
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: Etc/UTC
      TZ: Etc/UTC
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_TEMPLATES_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_COMMUNITY_PACKAGES_ENABLED: 'false'
      N8N_RUNNERS_ENABLED: 'true'
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: 'false'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: 168
    volumes:
      - n8n_data:/home/node/.n8n
      - ./trust/nvidia-gpu-server.crt:/etc/krishadmin-hq/nvidia-gpu-server.crt:ro
    networks: [database, services]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
  runners:
    image: n8nio/runners:${N8N_VERSION}
    restart: unless-stopped
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
    networks: [services]
    depends_on:
      n8n:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
volumes:
  postgres_data:
  n8n_data:
networks:
  database:
    internal: true
  services:
